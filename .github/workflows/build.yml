name: APK Derle

on:
  push:
  workflow_dispatch:
    inputs:
      islem:
        description: "Ne yapilsin?"
        type: choice
        default: debug-apk
        options:
          - debug-apk
          - anahtar-uret
          - yayin-aab

jobs:
  debug:
    if: github.event_name == 'push' || github.event.inputs.islem == 'debug-apk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Test APK derle
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Oynatici-APK
          path: app/build/outputs/apk/debug/*.apk

  anahtar:
    if: github.event.inputs.islem == 'anahtar-uret'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Imza anahtari uret
        run: |
          PW=$(openssl rand -hex 12)
          keytool -genkeypair -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Ruha TV, O=Ruha TV, C=TR" > /dev/null 2>&1
          {
            echo "KEYSTORE_PASSWORD=$PW"
            echo "KEY_PASSWORD=$PW"
            echo "KEY_ALIAS=upload"
            echo "KEYSTORE_BASE64=$(base64 -w0 upload.jks)"
          } > SIFRELER.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ANAHTAR-GIZLI
          path: |
            SIFRELER.txt
            upload.jks

  yayin:
    if: github.event.inputs.islem == 'yayin-aab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Anahtari hazirla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "HATA: KEYSTORE_BASE64 secret tanimli degil. Once anahtar-uret adimini yapip 4 secret ekleyin."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | sed 's/^KEYSTORE_BASE64=//' | tr -d ' \r\n"' | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Imzali AAB ve APK derle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Yayin-Dosyalari
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
